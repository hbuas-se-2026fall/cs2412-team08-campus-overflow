# CampusOverflow 持续集成流水线（对应 arc42 第 10 章适应度函数与第 7 章部署视图）
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

# 渐进式质量门禁（PB-04 / 指导书 T0-04）：SPRINT_MODULES 列出当前 Sprint 需全量验证的模块，
# 随 Sprint 推进逐步加入：S1=共享内核+Identity+Q&A 领域 → S2 加入 Q&A/Reputation 应用层 → S3 全量。
env:
  SPRINT_MODULES: co-shared-kernel,co-identity/co-identity-domain,co-identity/co-identity-application,co-identity/co-identity-interfaces,co-identity/co-identity-api,co-identity/co-identity-infrastructure,co-qa/co-qa-domain

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    # job 级注入，供 sonar 步骤的 if 条件判断 Secrets 是否配置（GitHub 不允许 if 直接引用 secrets）
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 阶段 1：编译（模块依赖不成环由 Maven 保证）
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      # 阶段 2：单元测试（渐进式门禁：仅跑 SPRINT_MODULES 范围内模块，随 Sprint 扩展）
      - name: 单元测试
        run: mvn -B -f backend/pom.xml test -pl "$SPRINT_MODULES" -am

      # 阶段 3：架构适应度函数（ArchUnit：FF-1~FF-6）
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -am -Dtest=ArchitectureTest -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      # 阶段 4：领域层覆盖率门禁（仅收窄到 SPRINT_MODULES，低于阈值直接失败）
      - name: 覆盖率门禁
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false -pl "$SPRINT_MODULES" -am

      # 阶段 5：集成测试（Testcontainers 拉起真实 MySQL + Redis；T0-04：集成测试暂允许失败，
      # 待 Sprint 3 恢复完整门禁——ADR-010）
      - name: 集成测试
        run: mvn -B -f backend/pom.xml verify -Dsurefire.skip=true
        continue-on-error: true

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/*-reports/*.xml"

      - name: 归档 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: "backend/**/target/site/jacoco/**"
          if-no-files-found: ignore

      # 阶段 6：SonarQube 静态扫描 + 质量门禁（Lab 7 Step 3）
      # 需要仓库 Secrets：SONAR_TOKEN、SONAR_HOST_URL；未配置时本步骤自动跳过，不阻塞其他步骤
      - name: SonarQube 扫描与质量门禁
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false -pl "$SPRINT_MODULES" -am
          mvn -B -f backend/pom.xml sonar:sonar \
            -Dsonar.projectKey=campus-overflow \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=true

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .
