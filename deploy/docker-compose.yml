# 一键启动完整环境：docker compose -f deploy/docker-compose.yml --profile observability up -d --build
# 仅启动应用（不含监控）：docker compose -f deploy/docker-compose.yml up -d --build
name: campus-overflow

services:
  mysql:
    image: mysql:8.0.39
    container_name: co-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --ngram-token-size=2               # 中文全文检索（ADR-005）
      - --innodb-ft-enable-stopword=0      # 避免 ngram 词元因包含停用词被丢弃
      - --default-time-zone=+00:00         # 全库统一 UTC
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pwd}
      MYSQL_DATABASE: campus_overflow
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:-campus_dev_pwd}
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: co-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: co-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES:-prod}   # 演示时显式写 prod,demo；demo 会写入演示数据
      DB_HOST: mysql
      DB_USER: campus
      DB_PASSWORD: ${DB_PASSWORD:-campus_dev_pwd}
      REDIS_HOST: redis
      CO_FIELD_KEY: ${CO_FIELD_KEY:?CO_FIELD_KEY 未设置，见 deploy/.env.example}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}                   # 经 HTTPS 发布时置 true
      TZ: UTC
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["${BACKEND_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: co-web
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports: ["${WEB_PORT:-80}:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: co-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: co-grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    depends_on: [prometheus]
    ports: ["3000:3000"]
    volumes: ["grafana-data:/var/lib/grafana"]

volumes:
  mysql-data:
  redis-data:
  grafana-data:
