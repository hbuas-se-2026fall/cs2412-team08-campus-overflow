server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # 安全响应头（后端也会设置，这里对静态资源补齐）
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # SPA 前端：找不到文件时回退到 index.html，交给前端路由
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Docker 内置 DNS：后端容器重启后 IP 会变，用变量 + resolver 让 nginx 重新解析，避免 502
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream backend:8080;

    # API 反向代理：保持同源，Cookie（SESSION / XSRF-TOKEN）无需跨域配置
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
    }

    # actuator 只白名单开放 health 与 readiness，其余一律 404，
    # 避免 /actuator/health/ 这类带尾斜杠的请求落进 SPA 回退、返回 200 HTML 被误判为健康
    location ^~ /actuator/ {
        location ~ ^/actuator/health(/readiness)?/?$ {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
        }
        return 404;
    }
}
