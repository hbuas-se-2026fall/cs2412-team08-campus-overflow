# SonarQube 扫描配置（Lab 7 Step 3 质量门禁）
# 位置要求：本文件在 backend/ 目录下（mvn 在此目录执行，Sonar 默认以执行目录为 projectBaseDir）
#
# 本地用法：
#   mvn -f backend/pom.xml verify -DskipITs -Djacoco.skip=false          # 先产出各模块 jacoco.xml
#   mvn -f backend/pom.xml -N sonar:sonar -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<TOKEN>
# CI 用法：仓库 Secrets 配 SONAR_TOKEN / SONAR_HOST_URL，ci.yml 的 sonar 步骤自动推送

sonar.projectKey=campus-overflow
sonar.projectName=CampusOverflow
sonar.sourceEncoding=UTF-8

# 只扫后端 Java 模块（前端由 tsc + ESLint 把关）
sonar.sources=co-shared-kernel,co-identity,co-qa,co-reputation,co-discovery,co-bootstrap
sonar.tests=co-shared-kernel,co-identity,co-qa,co-reputation,co-discovery,co-bootstrap
sonar.exclusions=**/target/**,**/src/main/resources/**,**/*.sql

sonar.test.inclusions=**/src/test/java/**/*.java
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes

# 复用 JaCoCo 报告：mvn verify -Djacoco.skip=false 生成 target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
